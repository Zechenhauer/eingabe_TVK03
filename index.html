<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 3 — Schnell-Erfassung (Supabase)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 9px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.3);
        }

        legend {
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
            padding: 0 6px;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .success-msg {
            margin-top: 10px;
            text-align: center;
            color: var(--success);
            font-size: 0.9rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 TV Kapellen 3 — Schnell-Erfassung</h2>

    <div id="formSection">
        <div class="grid-3">
            <div class="form-group">
                <label for="spieltag">Spieltag Nr.</label>
                <input type="number" id="spieltag" readonly style="background:#111827; color:#34d399; font-weight:bold;">
            </div>
            <div class="form-group">
                <label for="matchDate">Datum auswählen</label>
                <select id="matchDate" onchange="onDateChange()"></select>
            </div>
            <div class="form-group">
                <label for="endergebnisTeam">Endstand Team</label>
                <input type="text" id="endergebnisTeam" value="12:8" placeholder="z.B. 12:8">
            </div>
        </div>

        <div class="form-group">
            <label for="opponentTeam">Gegner Mannschaft (Auto)</label>
            <input type="text" id="opponentTeam" readonly style="color: var(--accent); background: #111827; font-weight:bold;">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="block">Block</label>
                <select id="block" onchange="onBlockChange()">
                    <option value="1. Block - Einzel (1-8)">1. Block - Einzel (1-8)</option>
                    <option value="Doppel">Doppel (1-4)</option>
                    <option value="2. Block - Einzel (9-16)">2. Block - Einzel (9-16)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="matchNumber">Partie-Nummer im Block</label>
                <select id="matchNumber"></select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group" id="groupPlayer1">
                <label for="playerKapellen">Spieler Kapellen 3</label>
                <select id="playerKapellen"></select>
            </div>
            <div class="form-group" id="groupPlayer2" style="display: none;">
                <label for="playerKapellen2">2. Spieler Kapellen (Doppelpartner)</label>
                <select id="playerKapellen2"></select>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="opponentPlayer">Gegner Name 1</label>
                <select id="opponentPlayer"></select>
            </div>
            <div class="form-group" id="groupOpponent2" style="display: none;">
                <label for="opponentPlayer2">Gegner Name 2 (Doppelpartner)</label>
                <select id="opponentPlayer2"></select>
            </div>
        </div>

        <fieldset>
            <legend>Spieldaten</legend>
            <div class="grid-3">
                <div class="form-group">
                    <label for="ergebnisSpiel">Ergebnis</label>
                    <input type="text" id="ergebnisSpiel" value="3:1" placeholder="3:1">
                </div>
                <div class="form-group">
                    <label for="avg">Average</label>
                    <input type="number" step="0.01" id="avg" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="darts">Darts pro Leg</label>
                    <input type="text" id="darts" placeholder="32,25,18">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Scores & Highlights</legend>
            <div class="grid-3">
                <div class="form-group"><label for="s60">60+</label><input type="number" id="s60" value="0"></div>
                <div class="form-group"><label for="s80">80+</label><input type="number" id="s80" value="0"></div>
                <div class="form-group"><label for="s100">100+</label><input type="number" id="s100" value="0"></div>
            </div>
            <div class="grid-3" style="margin-top: 8px;">
                <div class="form-group"><label for="s140">140+</label><input type="number" id="s140" value="0"></div>
                <div class="form-group"><label for="count180">180er</label><input type="number" id="count180" value="0"></div>
                <div class="form-group"><label for="hf">High Finish (HF)</label><input type="number" id="hf" value="0"></div>
            </div>
        </fieldset>

        <button onclick="saveToSupabase(event)">💾 In Supabase Speichern</button>
        <div id="successMsg" class="success-msg">✓ Match erfolgreich in Supabase gespeichert!</div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://lhusylpjnujlqomougmg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_yXEueWILvAq-Vm2VfTuYyg_BIQeE1KK';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const teamKader = [
        "Jürgen Schützendorf", "Markus Ginsel", "Thomas Kliver", "Leon Gerber", "Gregor Marek", "Markus Lenz", "Florian Hartwich", "Wolfram Senger", "Lars Neutag", "Ludger Schledorn", "Andreas Denner", "Niklas Weichert", "Michael Müller", "Yannick Steffes"
    ];

    const schedule = {
        "2026-09-05": "TV Kapellen 1919 e.V. 2",
        "2026-09-18": "DSC Goch 3",
        "2026-09-25": "Rumelner TV 3",
        "2026-10-10": "DSC Goch 4",
        "2026-10-23": "Triple Inn Issum 2",
        "2026-11-07": "SV Menzelen 1925",
        "2026-11-13": "Die Wardter Darter",
        "2026-11-27": "The Red Lions Xanten 1",
        "2027-01-09": "Hart am Draht",
        "2027-01-22": "TV Kapellen 1919 e.V. 2",
        "2027-02-06": "DSC Goch 3",
        "2027-02-19": "Rumelner TV 3",
        "2027-03-05": "DSC Goch 4",
        "2027-03-13": "Triple Inn Issum 2",
        "2027-04-02": "SV Menzelen 1925",
        "2027-04-24": "Die Wardter Darter",
        "2027-05-07": "The Red Lions Xanten 1",
        "2027-05-14": "Hart am Draht"
    };

    const opponentRosters = {
        "DSC Goch 3": ["Lucas Keisers", "Patryk Tajdus", "Juri Lambert", "Jannik Lommen", "Manfred Michels", "Xavier Tomalla", "Björn Janssen", "Antoni Rolniczak", "Jonas Neiling", "Tim Knops", "Sven Stiebing", "Lennart Upmeyer", "Lukas Kerst", "Sebastian Wouters", "Linus Kerst", "Michael Loock"],
        "DSC Goch 4": ["Jens Robert Michels", "Ben Schweidler", "Patrick Thellmann", "Andreas Geurtsen", "Alexander Schmidt", "Mario van Elst", "Melanie Zwanziger", "Kevin van Elst", "Tobias Klamp", "Hans Günther Seidl", "Marco Hofkens", "Maximilian Henn", "Jörg Hillmann", "Michael Schweidler", "Hans-Jürgen Otto", "Adrian Hoppe", "Justus Kilzer", "Holger Stayen", "Niklas Krämer"],
        "Die Wardter Darter": ["Alexander Reis", "Narayan Amanupunnjo", "Marvin Loth", "Ralf Graumann", "Christian Dederle", "Daniel Venhoff", "Marius Bußmann", "Rainer Staymann", "Martin Wegner", "Timo von Scheidt", "André Kaufels"],
        "Hart am Draht": ["Ann-Kathrin Brugmann", "Justin Schraven", "Leandro Wessiepe", "Pierre Lohmann", "Marius Hergesell", "Kevin Haßheider", "Henning Felder", "Annkathrin Wanders", "Saskia Husmann", "Benjamin Borgards", "Philipp-Sascha Brugmann", "Stefan Borgards", "Marco Inghilleri", "Melanie Bendriss", "Manuela Weis", "Robin Weis", "Michael Ganther", "Thomas Zygar"],
        "Rumelner TV 3": ["Linda Aurora Friedrich", "Christian Krause", "Andreas Ervenich", "Stefan Eilbrecht", "Sebastian Pohl", "Pierre von Dahlen", "Manuel Wagner", "Marvin Fünfstück", "Valentin De Spirt", "Alexander Wahl", "Maximilian Veron", "Mike Küffen", "Seray Altun", "Sam von Dahlen", "Sascha Schütte"],
        "SV Menzelen 1925": ["Iris Reimer", "Julian Keisers", "Erich Janik", "Martin Haberstroh", "Johannes Wynen", "Thomas Kiwitt", "Robert Giesen", "Christoph Luschgy", "Tanja Wynen", "Sven Krams", "Stephan Kempkes", "Daniel Kempkes", "Markus Reimer"],
        "TV Kapellen 1919 e.V. 2": ["Philip Möller", "Markus Elgersma", "Christian Schreiber", "Dominik Herz", "Thomas Franzen", "Danny Voß", "Markus Thiele", "Daniel Simanowitz", "Florian Weindorf", "Holger Weberpold", "Andre Pogoda"],
        "The Red Lions Xanten 1": ["Sebastian ALosery", "Jan Pötters", "Stephan Reintges", "Raphael Wefers", "Kai Maas", "Dustin Stenzel", "Tobias Reintges", "Björn Hesse"],
        "Triple Inn Issum 2": ["Lukas Helmes", "Sarah Hillejan", "Simon Hillejan", "Thomas Liebenow", "Marcel Angenendt", "Hans-Willi Hollick", "Joshua Jäschke", "Stefan Hanauer", "Michael Heinen", "Stefan Klein", "Christoph Passens", "Karl-Heinz Grimm", "Daniel Moschüring", "Michael Delbeck", "Sascha Rudies"]
    };

    document.addEventListener("DOMContentLoaded", () => {
        let dateSelect = document.getElementById("matchDate");
        dateSelect.innerHTML = "";
        let index = 1;
        for (let [date, opponent] of Object.entries(schedule)) {
            let opt = document.createElement("option");
            opt.value = date;
            opt.text = `Spieltag ${index} (${date}) - vs. ${opponent}`;
            opt.setAttribute("data-spieltag", index);
            opt.setAttribute("data-opponent", opponent);
            dateSelect.appendChild(opt);
            index++;
        }

        let p1 = document.getElementById("playerKapellen");
        let p2 = document.getElementById("playerKapellen2");
        p1.innerHTML = ""; p2.innerHTML = "";
        teamKader.forEach(p => {
            p1.innerHTML += `<option value="${p}">${p}</option>`;
            p2.innerHTML += `<option value="${p}">${p}</option>`;
        });

        onDateChange();
        onBlockChange();
    });

    function onDateChange() {
        let dateSelect = document.getElementById("matchDate");
        let selectedOpt = dateSelect.options[dateSelect.selectedIndex];
        if (!selectedOpt) return;

        document.getElementById("spieltag").value = selectedOpt.getAttribute("data-spieltag");
        let opponentTeam = selectedOpt.getAttribute("data-opponent");
        document.getElementById("opponentTeam").value = opponentTeam;

        let g1 = document.getElementById("opponentPlayer");
        let g2 = document.getElementById("opponentPlayer2");
        g1.innerHTML = ""; g2.innerHTML = "";
        let roster = opponentRosters[opponentTeam] || [];
        roster.forEach(p => {
            g1.innerHTML += `<option value="${p}">${p}</option>`;
            g2.innerHTML += `<option value="${p}">${p}</option>`;
        });
    }

    function onBlockChange() {
        let blockVal = document.getElementById("block").value;
        let isDoppel = blockVal.toLowerCase().includes("doppel");
        
        document.getElementById("groupPlayer2").style.display = isDoppel ? "block" : "none";
        document.getElementById("groupOpponent2").style.display = isDoppel ? "block" : "none";

        let partieSelect = document.getElementById("matchNumber");
        partieSelect.innerHTML = "";
        
        let maxPartien = 8;
        let prefix = "Einzel";
        
        if (isDoppel) {
            maxPartien = 4;
            prefix = "Doppel";
        }

        for (let i = 1; i <= maxPartien; i++) {
            partieSelect.innerHTML += `<option value="${prefix} ${i}">${prefix} ${i}</option>`;
        }
    }

    async function saveToSupabase(event) {
        let dateSelect = document.getElementById("matchDate");
        let selectedOpt = dateSelect.options[dateSelect.selectedIndex];
        let sNum = parseInt(selectedOpt.getAttribute("data-spieltag"));
        let datum = dateSelect.value;
        let gegnerTeam = selectedOpt.getAttribute("data-opponent");

        let endstand = document.getElementById("endergebnisTeam").value;
        let blockName = document.getElementById("block").value;
        let partieNum = document.getElementById("matchNumber").value;
        let isDoppel = blockName.toLowerCase().includes("doppel");

        let spielerKap = document.getElementById("playerKapellen").value;
        let gegnerName = document.getElementById("opponentPlayer").value;

        if (isDoppel) {
            let kap2 = document.getElementById("playerKapellen2").value;
            let geg2 = document.getElementById("opponentPlayer2").value;
            spielerKap = `${spielerKap} / ${kap2}`;
            gegnerName = `${gegnerName} / ${geg2}`;
        }

        let fullBlockName = `${blockName} (${partieNum})`;
        let ergebnis = document.getElementById("ergebnisSpiel").value;
        let avg = document.getElementById("avg").value;
        let darts = document.getElementById("darts").value.trim();

        let s60 = parseInt(document.getElementById("s60").value) || 0;
        let s80 = parseInt(document.getElementById("s80").value) || 0;
        let s100 = parseInt(document.getElementById("s100").value) || 0;
        let s140 = parseInt(document.getElementById("s140").value) || 0;
        let s180 = parseInt(document.getElementById("count180").value) || 0;
        let highFinish = parseInt(document.getElementById("hf").value) || 0;

        try {
            let { data: existingSt } = await supabaseClient.from('spieltage').select('id').eq('spieltag_nummer', sNum).single();
            let spieltagId;
            if (!existingSt) {
                let { data: newSt, error: stErr } = await supabaseClient.from('spieltage').insert([{ spieltag_nummer: sNum, datum: datum, gegner_team: gegnerTeam, endergebnis: endstand }]).select().single();
                if (stErr) throw stErr;
                spieltagId = newSt.id;
            } else {
                spieltagId = existingSt.id;
                await supabaseClient.from('spieltage').update({ endergebnis: endstand, datum: datum, gegner_team: gegnerTeam }).eq('id', spieltagId);
            }

            let { data: newMatch, error: mErr } = await supabaseClient.from('matches').insert([{
                spieltag_id: spieltagId, block_name: fullBlockName, spieler_kapellen: spielerKap,
                gegner_name: gegnerName, ergebnis: ergebnis, avg: avg ? parseFloat(avg) : null, darts: darts
            }]).select().single();
            if (mErr) throw mErr;

            let { error: sErr } = await supabaseClient.from('scoring_stats').insert([{
                match_id: newMatch.id, score_60: s60, score_80: s80, score_100: s100, score_140: s140, score_180: s180, high_finish: highFinish
            }]);
            if (sErr) throw sErr;

            let msg = document.getElementById("successMsg");
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 3000);

            document.getElementById("ergebnisSpiel").value = "3:1";
            document.getElementById("avg").value = "";
            document.getElementById("darts").value = "";
            document.getElementById("s60").value = "0";
            document.getElementById("s80").value = "0";
            document.getElementById("s100").value = "0";
            document.getElementById("s140").value = "0";
            document.getElementById("count180").value = "0";
            document.getElementById("hf").value = "0";

        } catch (err) {
            alert("⚠️ Fehler beim Speichern: " + err.message);
        }
    }
</script>

</body>
</html>
