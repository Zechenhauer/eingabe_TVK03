<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 3 - Schnell-Erfassung</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 9px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.3);
        }

        legend {
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
            padding: 0 6px;
        }

        button {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .success-msg {
            margin-top: 10px;
            text-align: center;
            color: var(--success);
            font-size: 0.85rem;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>TV Kapellen 3 - Match Erfassung</h2>
    
    <div class="grid-3">
        <div class="form-group">
            <label for="spieltag">Spieltag</label>
            <input type="number" id="spieltag" value="1">
        </div>
        <div class="form-group">
            <label for="matchDate">Datum</label>
            <input type="date" id="matchDate" value="2026-08-08" onchange="updateOpponent()">
        </div>
        <div class="form-group">
            <label for="endergebnisTeam">Endstand Team</label>
            <input type="text" id="endergebnisTeam" value="6:4">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="opponentTeam">Gegner Mannschaft (Auto)</label>
            <input type="text" id="opponentTeam" readonly style="color: var(--text-muted); background: #111827;">
        </div>
        <div class="form-group">
            <label for="block">Block</label>
            <select id="block" onchange="onBlockChange()">
                <option value="1. Block - Einzel">1. Block - Einzel (1-8)</option>
                <option value="Doppel - Block">Doppel - Block (1-4)</option>
                <option value="2. Block - Einzel">2. Block - Einzel (9-16)</option>
            </select>
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label for="matchNumber">Partie-Nummer im Block</label>
            <select id="matchNumber"></select>
        </div>
        <div class="form-group" id="groupPlayer1">
            <label id="labelPlayer1" for="playerKapellen">Spieler Kapellen</label>
            <select id="playerKapellen"></select>
        </div>
    </div>

    <!-- Doppel-Felder -->
    <div class="grid-2" id="doublePlayerContainer" style="display: none;">
        <div class="form-group">
            <label for="playerKapellen2">2. Spieler Kapellen (Doppel)</label>
            <select id="playerKapellen2"></select>
        </div>
        <div class="form-group">
            <label for="opponentPlayer2">2. Gegner Spieler (Doppel)</label>
            <select id="opponentPlayer2"></select>
        </div>
    </div>

    <div class="form-group">
        <label id="labelOpponent1" for="opponentPlayer">Gegner Name</label>
        <select id="opponentPlayer">
            <option value="">-- Erst Datum wählen --</option>
        </select>
    </div>

    <fieldset>
        <legend>Spieldaten</legend>
        <div class="grid-3">
            <div class="form-group">
                <label for="ergebnisSpiel">Ergebnis (z.B. 3:1)</label>
                <input type="text" id="ergebnisSpiel" value="3:1">
            </div>
            <div class="form-group">
                <label for="avg">Average</label>
                <input type="text" id="avg" value="0.00">
            </div>
            <div class="form-group">
                <label for="darts">Darts</label>
                <input type="text" id="darts" value="0">
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Scores & Highlights</legend>
        <div class="grid-4">
            <div class="form-group"><label for="s50">50+</label><input type="number" id="s50" value="0"></div>
            <div class="form-group"><label for="s80">80+</label><input type="number" id="s80" value="0"></div>
            <div class="form-group"><label for="s100">100+</label><input type="number" id="s100" value="0"></div>
            <div class="form-group"><label for="s140">140+</label><input type="number" id="s140" value="0"></div>
        </div>
        <div class="grid-2" style="margin-top: 8px;">
            <div class="form-group"><label for="count180">180er</label><input type="number" id="count180" value="0"></div>
            <div class="form-group"><label for="hf">High Finish (HF)</label><input type="number" id="hf" value="0"></div>
        </div>
    </fieldset>

    <button onclick="sendToGoogleSheet(event)">Daten an Google Sheet senden</button>
    <div id="successMsg" class="success-msg">Erfolgreich in die Tabelle eingetragen!</div>
</div>

<script>
    const SHEET_NAME = "TV Kapellen 3"; 
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzueR2jiTn74LbqOzWqAHrregerQnnjjuAfJsMQTty2KHj1i4oIdrz1xu4ewXRgj_cGHA/exec";

    const schedule = {
        "2026-09-05": "TV Kapellen 1919 e.V. 2",
        "2026-09-18": "DSC Goch 3",
        "2026-09-25": "Rumelner TV 3",
        "2026-10-10": "DSC Goch 4",
        "2026-10-23": "Triple Inn Issum 2",
        "2026-11-07": "SV Menzelen 1925",
        "2026-11-13": "Die Wardter Darter",
        "2026-11-27": "The Red Lions Xanten 1",
        "2027-01-09": "Hart am Draht",
        "2027-01-22": "TV Kapellen 1919 e.V. 2",
        "2027-02-06": "DSC Goch 3",
        "2027-02-19": "Rumelner TV 3",
        "2027-03-05": "DSC Goch 4",
        "2027-03-13": "Triple Inn Issum 2",
        "2027-04-02": "SV Menzelen 1925",
        "2027-04-24": "Die Wardter Darter",
        "2027-05-08": "The Red Lions Xanten 1",
        "2027-05-14": "Hart am Draht"
    };

    const opponentRosters = {
        "DSC Goch 3": ["Lucas Keisers", "Patryk Tajdus", "Juri Lambert", "Jannik Lommen", "Manfred Michels", "Xavier Tomalla", "Björn Janssen", "Antoni Rolniczak", "Jonas Neiling", "Tim Knops", "Sven Stiebing", "Lennart Upmeyer", "Lukas Kerst", "Sebastian Wouters", "Linus Kerst", "Michael Loock"],
        "DSC Goch 4": ["Jens Robert Michels", "Ben Schweidler", "Patrick Thellmann", "Andreas Geurtsen", "Alexander Schmidt", "Mario van Elst", "Melanie Zwanziger", "Kevin van Elst", "Tobias Klamp", "Hans Günther Seidl", "Marco Hofkens", "Maximilian Henn", "Jörg Hillmann", "Michael Schweidler", "Hans-Jürgen Otto", "Adrian Hoppe", "Justus Kilzer", "Holger Stayen", "Niklas Krämer"],
        "Die Wardter Darter": ["Alexander Reis", "Narayan Amanupunnjo", "Marvin Loth", "Ralf Graumann", "Christian Dederle", "Daniel Venhoff", "Marius Bußmann", "Rainer Staymann", "Martin Wegner", "Timo von Scheidt", "André Kaufels"],
        "Hart am Draht": ["Ann-Kathrin Brugmann", "Justin Schraven", "Leandro Wessiepe", "Pierre Lohmann", "Marius Hergesell", "Kevin Haßheider", "Henning Felder", "Annkathrin Wanders", "Saskia Husmann", "Benjamin Borgards", "Philipp-Sascha Brugmann", "Stefan Borgards", "Marco Inghilleri", "Melanie Bendriss", "Manuela Weis", "Robin Weis", "Michael Ganther", "Thomas Zygar"],
        "Rumelner TV 3": ["Michaela von Dahlen", "Christian Krause", "Stefan Eilbrecht", "Sebastian Pohl", "Pierre von Dahlen", "Marvin Fünfstück", "Valentin De Spirt", "Alexander Wahl", "Melanie Drees", "Mike Küffen", "Sam von Dahlen", "Sascha Schütte"],
        "SV Menzelen 1925": ["Iris Reimer", "Julian Keisers", "Erich Janik", "Martin Haberstroh", "Johannes Wynen", "Thomas Kiwitt", "Robert Giesen", "Christoph Luschgy", "Tanja Wynen", "Sven Krams", "Stephan Kempkes", "Daniel Kempkes", "Markus Reimer"],
        "TV Kapellen 1919 e.V. 2": ["Philip Möller", "Markus Thiele", "Danny Voß", "Andre Pogoda", "Florian Weindorf", "Daniel Simanowitz", "Christian Schreiber", "Dominik Herz", "Markus Elgersma", "Holger Weberpold", "Thomas Franzen"],
        "The Red Lions Xanten 1": ["Sebastian ALosery", "Jan Pötters", "Stephan Reintges", "Raphael Wefers", "Kai Maas", "Dustin Stenzel", "Tobias Reintges", "Björn Hesse"],
        "Triple Inn Issum 2": ["Lukas Helmes", "Sarah Hillejan", "Simon Hillejan", "Thomas Liebenow", "Marcel Angenendt", "Hans-Willi Hollick", "Joshua Jäschke", "Stefan Hanauer", "Michael Heinen", "Stefan Klein", "Christoph Passens", "Karl-Heinz Grimm", "Daniel Moschüring", "Michael Delbeck", "Sascha Rudies"]
    };

    // Euer eigener Kader (TV Kapellen 3)
    const singlePlayers = [
        "Jürgen Schützendorf", "Markus Ginsel", "Lars Neutag", "Ludger Schledorn", "Leon Gerber", "Gregor Marek", "Andreas Denner", "Niklas Weichert", "Markus Lenz", "Thomas Kliver", "Wolfram Senger", "Michael Müller", "Florian Hartwich", "Yannick Steffes"
    ];

    function onBlockChange() {
        const blockVal = document.getElementById("block").value;
        const numSelect = document.getElementById("matchNumber");
        const playerSelect1 = document.getElementById("playerKapellen");
        const playerSelect2 = document.getElementById("playerKapellen2");
        const doubleContainer = document.getElementById("doublePlayerContainer");
        const labelP1 = document.getElementById("labelPlayer1");
        const labelO1 = document.getElementById("labelOpponent1");
        
        numSelect.innerHTML = "";
        playerSelect1.innerHTML = "";
        playerSelect2.innerHTML = "";

        let count = 8;
        let isDouble = (blockVal === "Doppel - Block");

        if (isDouble) {
            count = 4;
            doubleContainer.style.display = "grid";
            labelP1.innerText = "1. Spieler Kapellen (Doppel)";
            labelO1.innerText = "1. Gegner Spieler (Doppel)";
        } else {
            doubleContainer.style.display = "none";
            labelP1.innerText = "Spieler Kapellen";
            labelO1.innerText = "Gegner Name";
        }

        for (let i = 1; i <= count; i++) {
            let opt = document.createElement("option");
            opt.value = i + ". " + (isDouble ? "Doppel" : "Einzel");
            opt.innerHTML = i + ". " + (isDouble ? "Doppel" : "Einzel");
            numSelect.appendChild(opt);
        }

        singlePlayers.forEach(player => {
            let opt1 = document.createElement("option");
            opt1.value = player;
            opt1.innerHTML = player;
            playerSelect1.appendChild(opt1);

            let opt2 = document.createElement("option");
            opt2.value = player;
            opt2.innerHTML = player;
            playerSelect2.appendChild(opt2);
        });

        updateOpponentRosters();
    }

    function updateOpponent() {
        updateOpponentRosters();
    }

    function updateOpponentRosters() {
        const dateVal = document.getElementById("matchDate").value;
        const opponentInput = document.getElementById("opponentTeam");
        const oppSelect1 = document.getElementById("opponentPlayer");
        const oppSelect2 = document.getElementById("opponentPlayer2");

        const team = schedule[dateVal] || "Unbekannter Gegner";
        opponentInput.value = team;

        oppSelect1.innerHTML = "";
        oppSelect2.innerHTML = "";

        if (opponentRosters[team]) {
            opponentRosters[team].forEach(player => {
                let opt1 = document.createElement("option");
                opt1.value = player;
                opt1.innerHTML = player;
                oppSelect1.appendChild(opt1);

                let opt2 = document.createElement("option");
                opt2.value = player;
                opt2.innerHTML = player;
                oppSelect2.appendChild(opt2);
            });
        } else {
            let opt1 = document.createElement("option");
            opt1.value = "";
            opt1.innerHTML = "-- Kein Kader --";
            oppSelect1.appendChild(opt1);

            let opt2 = document.createElement("option");
            opt2.value = "";
            opt2.innerHTML = "-- Kein Kader --";
            oppSelect2.appendChild(opt2);
        }
    }

    window.onload = function() {
        onBlockChange();
        updateOpponentRosters();
    };

    function sendToGoogleSheet(event) {
        const blockMain = document.getElementById("block").value;
        const matchNum = document.getElementById("matchNumber").value;
        const combinedBlockValue = blockMain + " (" + matchNum + ")";

        const isDouble = blockMain === "Doppel - Block";
        
        let playerKapellenVal = document.getElementById("playerKapellen").value;
        let opponentPlayerVal = document.getElementById("opponentPlayer").value;

        if (isDouble) {
            const playerKapellen2Val = document.getElementById("playerKapellen2").value;
            const opponentPlayer2Val = document.getElementById("opponentPlayer2").value;
            playerKapellenVal = playerKapellenVal + " / " + playerKapellen2Val;
            opponentPlayerVal = opponentPlayerVal + " / " + opponentPlayer2Val;
        }

        const payload = {
            sheetName: SHEET_NAME,
            spieltag: document.getElementById("spieltag").value,
            matchDate: document.getElementById("matchDate").value,
            opponentTeam: document.getElementById("opponentTeam").value,
            endergebnisTeam: document.getElementById("endergebnisTeam").value,
            block: combinedBlockValue,
            playerKapellen: playerKapellenVal,
            opponentPlayer: opponentPlayerVal,
            ergebnisSpiel: document.getElementById("ergebnisSpiel").value,
            avg: document.getElementById("avg").value,
            darts: document.getElementById("darts").value,
            count180: document.getElementById("count180").value,
            hf: document.getElementById("hf").value,
            s50: document.getElementById("s50").value,
            s80: document.getElementById("s80").value,
            s100: document.getElementById("s100").value,
            s140: document.getElementById("s140").value
        };

        const btn = event.target;
        btn.disabled = true;
        btn.innerText = "Wird übertragen...";

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        }).then(() => {
            btn.disabled = false;
            btn.innerText = "Daten an Google Sheet senden";
            const msg = document.getElementById("successMsg");
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 3000);
        }).catch(error => {
            console.error("Fehler:", error);
            alert("Fehler beim Übertragen!");
            btn.disabled = false;
            btn.innerText = "Daten an Google Sheet senden";
        });
    }
</script>

</body>
</html>
